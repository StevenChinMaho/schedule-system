server {
    listen 80;
    server_name _;

    # 容器內部的標準掛載路徑
    root /var/www/html;
    index index.php;

    # 取得真實訪客 IP：流量由專案內的 hn-tunnel 容器經 Docker 網路送達，
    # 故信任私有網段，並改採 Cloudflare 提供的 CF-Connecting-IP 標頭
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # ---------- 安全防禦 ----------

    # 隱藏檔：.env、.git、.editorconfig 等（保留 ACME 驗證用的 .well-known）
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 僅供後端引用或本機作業的目錄，一律不對外
    location ^~ /includes/ { deny all; }
    location ^~ /database/ { deny all; }
    location ^~ /logs/     { deny all; }
    location ^~ /課表PDF/  { deny all; }

    # 非網頁用途的副檔名：資料庫備份、原始課表、轉檔腳本、說明文件
    location ~* \.(sql|csv|xlsx?|pdf|py|md|log)$ {
        deny all;
    }

    # ---------- 路由 ----------

    # 靜態資源快取；頁面皆以 ?v=filemtime 破快取，故可放心設 immutable
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 本站每個 .php 都是獨立入口，沒有 front controller，
    # 因此找不到檔案就回 404，不要一律導向 index.php
    location / {
        try_files $uri $uri/ =404;
    }

    # 將 .php 請求轉發給 PHP-FPM 容器；try_files 確保只執行實際存在的檔案
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass hn-php:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
