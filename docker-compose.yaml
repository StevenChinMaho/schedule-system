# 明確指定專案名稱，網路與 volume 皆以此為前綴（schedule-system_db-data）。
# 未指定時 compose 會採用目錄名稱，屆時目錄改名會讓既有的資料庫 volume 被孤立。
name: schedule-system

services:
  # 1. MariaDB 資料庫
  #    僅掛在 internal 的 backend 網路上，不開放任何 port，
  #    除了 schedule-php 之外沒有任何容器（含 tunnel）連得到它。
  schedule-db:
    image: mariadb:10.11
    container_name: schedule-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?DB_ROOT_PASS 未設定，請參考 .env.example 建立 .env}
      # 僅建立應用程式帳號；各校資料庫與授權由 database/add-school.sh 建立
      MARIADB_USER: ${DB_USER:?DB_USER 未設定，請參考 .env.example 建立 .env}
      MARIADB_PASSWORD: ${DB_PASS:?DB_PASS 未設定，請參考 .env.example 建立 .env}
      TZ: Asia/Taipei
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - backend

  # 2. PHP-FPM 後端處理容器
  schedule-php:
    build: .
    container_name: schedule-php
    restart: unless-stopped
    environment:
      # 資料庫已在專案內，主機名固定為 schedule-db，不需外部設定。
      # 要連往哪一個資料庫由 includes/schools.php 依請求網域決定，
      # 故此處只提供共用的應用程式帳號。
      DB_HOST: schedule-db
      DB_USER: ${DB_USER:?DB_USER 未設定，請參考 .env.example 建立 .env}
      DB_PASS: ${DB_PASS:?DB_PASS 未設定，請參考 .env.example 建立 .env}
      TZ: Asia/Taipei
    volumes:
      - .:/var/www/html
    depends_on:
      schedule-db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  # 3. Nginx 網頁入口容器
  schedule-web:
    image: nginx:stable-alpine
    container_name: schedule-web
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
    volumes:
      - .:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - schedule-php
    networks:
      - frontend

  # 4. Cloudflare Tunnel
  #    對外的唯一出入口；主機不需開放任何 port。
  #    路由設定（hostname -> http://schedule-web:80）在 Cloudflare Dashboard 上維護。
  schedule-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: schedule-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN 未設定，請參考 .env.example 建立 .env}
      TZ: Asia/Taipei
    depends_on:
      - schedule-web
    networks:
      - frontend

networks:
  # 對外連線與容器間的 HTTP 流量
  frontend:
  # 資料庫專用；internal 表示此網路不具對外路由，schedule-db 無法連上網際網路
  backend:
    internal: true

volumes:
  db-data:
